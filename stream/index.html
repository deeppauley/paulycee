<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#090e18"><title>Pauly Cee · Stream Room</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="transport.css?v=20261022-halloween"><link rel="stylesheet" href="discovery.css?v=20261022"><link rel="stylesheet" href="compact.css?v=20261022"></head>
<body><header><a href="/">PC<span>••</span></a><span>STREAM ROOM <small>LIVE FROM YOUR PC</small></span><button id="disconnect" hidden>Disconnect</button></header>
<main><section id="connect" class="panel"><p class="eyebrow">YOUR LIBRARY, ON AIR</p><h1>Find your<br><em>next groove.</em></h1><p>Connecting to the public music library…</p><form id="connection"><label>PC server address<input id="server" type="url" required placeholder="https://your-server.trycloudflare.com" autocomplete="url"></label><button class="primary">Connect to library</button></form></section>
<section id="room" hidden><div class="heading"><div><p class="eyebrow" id="library-source">REKORDBOX / LIVE LIBRARY</p><h1>Your collection.</h1></div><button id="refresh">Refresh library</button></div>
<div class="toolbar"><label>Playlist<select id="playlist"></select></label><input id="search" type="search" placeholder="Search tracks or artists" aria-label="Search tracks"><button id="favorites" aria-pressed="false">♡ Favorites <span id="favorite-count">0</span></button></div>
<section class="player panel"><div class="deck"><p class="eyebrow">CURRENTLY PLAYING <span id="mix-state"></span></p><h2 id="now-title">No track selected</h2><p id="now-artist"></p><div id="metrics"></div></div><div class="next"><span class="eyebrow" id="next-label">UP NEXT</span><h3 id="next-title">—</h3><progress id="blend" max="1" value="0" aria-label="Crossfade progress"></progress></div>
<div class="transport"><button id="previous" aria-label="Previous track"><span class="skip-icon" aria-hidden="true">⏮</span><span class="skip-label">Previous</span></button><button id="play" class="primary">▶ Play</button><button id="jump">Jump to mix</button><button id="next" aria-label="Next track"><span class="skip-icon" aria-hidden="true">⏭</span><span class="skip-label">Next</span></button><button id="favorite-current" aria-label="Favorite current track">♡</button></div>
<div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" step=".1" value="0" aria-label="Seek current track"><span id="duration">0:00</span></div>
<div class="settings"><label>Mix tempo <input id="tempo" type="number" min="60" max="180" step=".1" value="120"> BPM</label><label>Volume <input id="volume" type="range" min="0" max="1" value=".8" step=".01"></label></div></section>
<section class="panel queue"><div class="queue-heading"><h2 id="queue-title">Tracks</h2><span id="count"></span></div><ol id="tracks"></ol><button id="load-more" hidden>Show more tracks</button></section></section><p id="status" role="status" aria-live="polite">Ready to connect.</p></main><script type="module" src="app.js?v=20261022-search-override"></script></body></html>
